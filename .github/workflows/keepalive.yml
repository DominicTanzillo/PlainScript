name: Keep HF Space Alive

on:
  schedule:
    # Every 30 minutes to prevent HF Space from sleeping
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space health endpoint
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dtanzillo-medclear.hf.space/api/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Space is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Space may be starting up or in error - this is expected after cold starts"
